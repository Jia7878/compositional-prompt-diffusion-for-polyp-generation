model:
  base_learning_rate: 1.0e-04
  target: ldm.models.diffusion.ddpm.LatentDiffusion
  params:
    linear_start: 0.00085
    linear_end: 0.0120
    num_timesteps_cond: 1
    log_every_t: 200
    timesteps: 1000
    first_stage_key: image
    cond_stage_key: caption
    image_size: 64
    channels: 4
    cond_stage_trainable: false   # Note: different from the one we trained before
    conditioning_key: crossattn
    monitor: val/loss_simple_ema
    scale_factor: 0.18215
    use_ema: False
    # ckpt_path: /home/hyl/yujia/pipeline/dataroot/models/runwayml/stable-diffusion-v1-5/v1-5-pruned.ckpt
    ckpt_path: /home/hyl/yujia/conditional-polyp-diffusion/latent-diffusion/resume_text_mask/2024-07-19T18-28-04_re_sd_mask/checkpoints/last.ckpt
    # ckpt_path: /home/hyl/yujia/conditional-polyp-diffusion/latent-diffusion/resume_sd/2024-04-21T22-44-47_stable-diffusion/checkpoints/last.ckpt
    scheduler_config: # 10000 warmup steps
      target: ldm.lr_scheduler.LambdaLinearScheduler
      params:
        warm_up_steps: [ 10000 ]
        cycle_lengths: [ 10000000000000 ] # incredibly large number to prevent corner cases
        f_start: [ 1.e-6 ]
        f_max: [ 1. ]
        f_min: [ 1. ]

    unet_config:
      target: ldm.modules.diffusionmodules.openaimodel.UNetModel
      params:
        image_size: 32 # unused
        in_channels: 4
        out_channels: 4
        model_channels: 320
        attention_resolutions: [ 4, 2, 1 ]
        num_res_blocks: 2
        channel_mult: [ 1, 2, 4, 4 ]
        num_heads: 8
        use_spatial_transformer: True
        transformer_depth: 1
        context_dim: 768
        use_checkpoint: True
        legacy: False

    first_stage_config:
      target: ldm.models.autoencoder.AutoencoderKL
      params:
        embed_dim: 4
        monitor: val/rec_loss
        ddconfig:
          double_z: true
          z_channels: 4
          resolution: 256
          in_channels: 3
          out_ch: 3
          ch: 128
          ch_mult:
          - 1
          - 2
          - 4
          - 4
          num_res_blocks: 2
          attn_resolutions: []
          dropout: 0.0
        lossconfig:
          target: torch.nn.Identity

    cond_stage_config:
      target: ldm.modules.encoders.modules.FrozenCLIPEmbedder
data:
  target: main.DataModuleFromConfig
  params:
    batch_size: 16
    num_workers: 0
    wrap: True
    train:
      target: ldm.data.celebahq.CelebAConditionalDataset
      params:
        phase: train
        im_preprocessor_config:
          target: ldm.data.celebahq.DalleTransformerPreprocessor
          params:
            size: 256
            phase: train
        test_dataset_size: 1
        conditions:
          - 'text'
        # image_folder: '/home/hyl/yujia/data_Description/train/images_256'
        image_folder: '/home/hyl/yujia/add_data'
    validation:
        target: ldm.data.celebahq.CelebAConditionalDataset
        params:
          phase: test
          im_preprocessor_config:
            target: ldm.data.celebahq.DalleTransformerPreprocessor
            params:
              size: 256
              phase: val
          test_dataset_size: 1
          conditions:
            - 'text'
          # image_folder: '/home/hyl/yujia/data_Description/train/images_256'
          image_folder: '/home/hyl/yujia/add_data'
    


lightning:
  callbacks:
    image_logger:
      target: main.ImageLogger
      params:
        batch_frequency: 100000
        max_images: 8
        increase_log_steps: False
    metrics_over_trainsteps_checkpoint:
      target: pytorch_lightning.callbacks.ModelCheckpoint
      params:
        filename: "{epoch}-{step}"
        every_n_train_steps: 50
        save_top_k: -1

    
  trainer:
    benchmark: true
    max_epochs: 1